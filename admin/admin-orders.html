<!DOCTYPE html>
<html lang="en">
<head>
<script type="module">
  import { auth } from "../assets/js/firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  onAuthStateChanged(auth, (user) => {
    if (!user) window.location.href = "login.html";
  });
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Orders | Vaishnavi Furniture</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    .filter-pill { cursor: pointer; }
    .filter-pill.active { outline: 2px solid #0d6efd; outline-offset: 1px; }
    details summary { cursor: pointer; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h2 class="mb-0">🧾 Customer Orders</h2>
      <div class="d-flex gap-2">
        <a href="admin.html" class="btn btn-outline-secondary btn-sm">← Products</a>
        <button id="logout-btn" class="btn btn-outline-danger btn-sm">Logout</button>
      </div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-md-6">
        <input id="search" type="search" class="form-control" placeholder="🔍 Search by name or phone…" />
      </div>
    </div>
    <div id="filter-pills" class="d-flex flex-wrap gap-2 mb-3"></div>
    <div id="order-list" class="d-flex flex-column gap-3"></div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1080"></div>

  <!-- Edit Product Modal -->
  <div class="modal fade" id="editProductModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="edit-product-form">
          <div class="modal-header">
            <h5 class="modal-title">Edit Product</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="edit-product-id">
            <div class="mb-3">
              <label for="edit-name" class="form-label">Name</label>
              <input type="text" class="form-control" id="edit-name" required>
            </div>
            <div class="mb-3">
              <label for="edit-category" class="form-label">Category</label>
              <input type="text" class="form-control" id="edit-category" required>
            </div>
            <div class="mb-3">
              <label for="edit-price" class="form-label">Price</label>
              <input type="number" class="form-control" id="edit-price" required>
            </div>
            <div class="mb-3">
              <label for="edit-image" class="form-label">Image</label>
              <input type="file" class="form-control" id="edit-image">
              <img id="edit-preview" src="#" alt="Preview" class="img-fluid mt-2 d-none">
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, auth } from "../assets/js/firebase.js";
    import {
      collection,
      getDocs,
      updateDoc,
      doc,
      arrayUnion
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    // ── Order lifecycle ──────────────────────────────────────────
    const STATUSES = [
      { id: "received",         label: "Received",          badge: "secondary" },
      { id: "confirmed",        label: "Confirmed",         badge: "info" },
      { id: "in_production",    label: "In Production",     badge: "warning" },
      { id: "ready",            label: "Ready for Delivery", badge: "primary" },
      { id: "out_for_delivery", label: "Out for Delivery",  badge: "dark" },
      { id: "delivered",        label: "Delivered",         badge: "success" },
      { id: "cancelled",        label: "Cancelled",         badge: "danger" },
    ];
    // Map old status values to the new pipeline
    const LEGACY_STATUS = {
      new: "received",
      "in-progress": "in_production",
      shipped: "out_for_delivery",
      delivered: "delivered",
    };

    const orderCollection = collection(db, "orders");
    const productCollection = collection(db, "products");
    const storage = getStorage();

    let allOrders = [];
    let activeFilter = "all";
    let searchTerm = "";

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
    const normStatus = (s) => LEGACY_STATUS[s] || s || "received";
    const statusMeta = (id) => STATUSES.find((x) => x.id === id) || STATUSES[0];
    const fmtDate = (iso) => {
      if (!iso) return "—";
      return new Date(iso).toLocaleString("en-IN", {
        day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
      });
    };

    function showToast(msg, type = "success") {
      const container = document.getElementById("toast-container");
      const el = document.createElement("div");
      el.className = `toast align-items-center text-bg-${type} border-0`;
      el.setAttribute("role", "alert");
      el.innerHTML = `<div class="d-flex"><div class="toast-body"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>`;
      el.querySelector(".toast-body").textContent = msg;
      container.appendChild(el);
      new bootstrap.Toast(el, { delay: 2500 }).show();
    }

    let productMap = {};

    async function loadOrders() {
      const productSnap = await getDocs(productCollection);
      productMap = {};
      productSnap.forEach((p) => (productMap[p.id] = p.data()));

      const orderSnap = await getDocs(orderCollection);
      allOrders = [];
      orderSnap.forEach((d) => allOrders.push({ id: d.id, ...d.data() }));
      // Newest first
      allOrders.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

      renderFilters();
      renderList();
    }

    function renderFilters() {
      const counts = { all: allOrders.length };
      STATUSES.forEach((s) => (counts[s.id] = 0));
      allOrders.forEach((o) => {
        const id = normStatus(o.orderStatus);
        counts[id] = (counts[id] || 0) + 1;
      });

      const pill = (id, label) => `
        <span class="badge rounded-pill text-bg-${id === "all" ? "dark" : statusMeta(id).badge}
          filter-pill ${activeFilter === id ? "active" : ""}"
          onclick="setFilter('${id}')">${label} (${counts[id] || 0})</span>`;

      document.getElementById("filter-pills").innerHTML =
        pill("all", "All") + STATUSES.map((s) => pill(s.id, s.label)).join("");
    }

    window.setFilter = function (id) {
      activeFilter = id;
      renderFilters();
      renderList();
    };

    function historyHtml(order) {
      const h = order.statusHistory || [];
      if (!h.length) return "";
      const items = [...h]
        .reverse()
        .map((e) => {
          const m = statusMeta(normStatus(e.status));
          return `<li><span class="badge text-bg-${m.badge}">${m.label}</span>
            <small class="text-muted">${fmtDate(e.at)}</small></li>`;
        })
        .join("");
      return `<details class="mt-2"><summary class="text-muted small" style="cursor:pointer">
        Status history (${h.length})</summary>
        <ul class="small mt-1 mb-0 ps-3">${items}</ul></details>`;
    }

    function orderCard(orderId, order, products) {
      const st = normStatus(order.orderStatus);
      const meta = statusMeta(st);
      const customer = order.customer || {};
      const itemList = (order.items || [])
        .map((i) => {
          const p = products[i.productId];
          return `${i.qty} × ${esc(p ? p.name : i.productId)}`;
        })
        .join(", ");

      const div = document.createElement("div");
      div.className = "card shadow-sm";
      div.innerHTML = `
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <strong>${esc(customer.name)}</strong>
              <span class="badge text-bg-${meta.badge} ms-2">${meta.label}</span><br>
              <small class="text-muted">📞 ${esc(customer.phone)} · 🏠 ${esc(customer.address)}</small>
            </div>
            <small class="text-muted text-end">🕒 ${fmtDate(order.createdAt)}</small>
          </div>
          <div class="mb-2 small">${itemList}</div>
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <strong>Total: ₹${Number(order.total || 0).toLocaleString("en-IN")}</strong>
            <div class="d-flex align-items-center gap-2">
              <label class="small text-muted mb-0">Status:</label>
              <select class="form-select form-select-sm w-auto"
                onchange="updateOrderStatus('${orderId}', this.value)">
                ${STATUSES.map(
                  (s) => `<option value="${s.id}" ${s.id === st ? "selected" : ""}>${s.label}</option>`
                ).join("")}
              </select>
            </div>
          </div>
          ${historyHtml(order)}
        </div>`;
      return div;
    }

    function renderList() {
      const list = document.getElementById("order-list");
      list.innerHTML = "";

      const filtered = allOrders.filter((o) => {
        if (activeFilter !== "all" && normStatus(o.orderStatus) !== activeFilter) return false;
        if (searchTerm) {
          const c = o.customer || {};
          const hay = `${c.name} ${c.phone}`.toLowerCase();
          if (!hay.includes(searchTerm)) return false;
        }
        return true;
      });

      if (!filtered.length) {
        list.innerHTML = "<div class='alert alert-light'>No orders found.</div>";
        return;
      }

      filtered.forEach((o) => list.appendChild(orderCard(o.id, o, productMap)));
    }

    window.updateOrderStatus = async function (orderId, newStatus) {
      try {
        await updateDoc(doc(db, "orders", orderId), {
          orderStatus: newStatus,
          updatedAt: new Date().toISOString(),
          statusHistory: arrayUnion({ status: newStatus, at: new Date().toISOString() }),
        });
        showToast(`✅ Order marked: ${statusMeta(newStatus).label}`);
        loadOrders();
      } catch (e) {
        console.error(e);
        showToast("❌ Could not update status", "danger");
      }
    };

    document.getElementById("search").addEventListener("input", (e) => {
      searchTerm = e.target.value.trim().toLowerCase();
      renderList();
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    // ── Edit Product Modal (existing) ────────────────────────────
    const editForm = document.getElementById("edit-product-form");
    editForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("edit-product-id").value;
      const name = document.getElementById("edit-name").value;
      const category = document.getElementById("edit-category").value;
      const price = parseInt(document.getElementById("edit-price").value);
      const file = document.getElementById("edit-image").files[0];

      let imageUrl = null;
      if (file) {
        const storageRef = ref(storage, `vaishnavi-products/${id}.jpg`);
        await uploadBytes(storageRef, file);
        imageUrl = await getDownloadURL(storageRef);
      }

      const updateData = { name, category, price };
      if (imageUrl) updateData.image = imageUrl;

      await updateDoc(doc(db, "products", id), updateData);
      showToast("✅ Product updated.");
      location.reload();
    });

    window.openEditModal = function (product) {
      document.getElementById("edit-product-id").value = product.id;
      document.getElementById("edit-name").value = product.name;
      document.getElementById("edit-category").value = product.category;
      document.getElementById("edit-price").value = product.price;
      document.getElementById("edit-preview").src = product.image;
      document.getElementById("edit-preview").classList.remove("d-none");
      new bootstrap.Modal(document.getElementById("editProductModal")).show();
    };

    loadOrders();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
